<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Topologia Kubernetes</title>
  <desc id="d">Namespaces separados para o plano de controle, com Gateway, e para o MeshAgent</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="cpGrad" x1="0" y1="0" x2="500" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="zoneCollie" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="zoneClient" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.08"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3" fill="none" stroke="#16A34A" stroke-width="1.5"/>
    </marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#94A3B8" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1100" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1100" height="480" rx="28" fill="url(#dots)"/>
  <text x="550.0" y="36" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2.4">COLLIE OPSMESH</text>
  <text x="550.0" y="64" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle">Topologia Kubernetes</text>
  <text x="550.0" y="88" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan font-style="italic">Namespaces</tspan> separados: plano de controle com Gateway · MeshAgent</text>

  <rect x="40" y="110" width="500" height="300" rx="20" fill="url(#zoneCollie)"/>
  <rect x="560" y="110" width="500" height="300" rx="20" fill="url(#zoneClient)"/>
  <text x="64" y="140" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#2563EB" letter-spacing="1.4">NAMESPACE DO PLANO DE CONTROLE</text>
  <text x="584" y="140" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#16A34A" letter-spacing="1.4">NAMESPACE DO MESHAGENT</text>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="64" y="160" width="210" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="169.0" y="191.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">API</text>
      <text x="169.0" y="216" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">+ processamento de resultados</text>
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="290" y="160" width="210" height="70" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <text x="395.0" y="191.0" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">Gateway</text>
      <text x="395.0" y="216" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">publicação no cluster</text>
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="64" y="250" width="210" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="169.0" y="281.0" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">Banco de dados</text>
      <text x="169.0" y="306" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">no cluster ou externo</text>
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="290" y="250" width="210" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="395.0" y="281.0" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">Mensageria</text>
      <text x="395.0" y="306" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">filas duráveis</text>
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="64" y="340" width="436" height="50" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="282.0" y="370.0" font-size="13" font-weight="800" fill="#64748B" text-anchor="middle">Evidence Processor · Inteligência Artificial — em evolução</text>
      
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="584" y="180" width="446" height="100" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <text x="807.0" y="226.0" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">MeshAgent <tspan font-style="italic">Deployment</tspan></text>
      <text x="807.0" y="266" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">RBAC: leitura do cluster / escrita aprovada</text>
    </g>
  
    <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
      <rect x="584" y="310" width="446" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="807.0" y="341.0" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">Carga de trabalho alvo</text>
      <text x="807.0" y="366" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle"><tspan font-style="italic">namespaces</tspan> do cliente</text>
    </g>

</svg>
