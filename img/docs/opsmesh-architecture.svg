<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="640" viewBox="0 0 1100 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura Collie OpsMesh</title>
  <desc id="d">Pedido da IA ou Cockpit passa pelo Control Plane (identidade, politica, aprovacao e auditoria), atravessa o Gateway opaco e chega ao MeshAgent outbound-only, que executa acoes tipadas na infra com Edge Redactor.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="cpGrad" x1="200" y1="160" x2="900" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="zoneAsk" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="zoneEdge" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCFCE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.08"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3" fill="none" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3" fill="none" stroke="#16A34A" stroke-width="1.5"/>
    </marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#94A3B8" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1100" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1100" height="640" rx="28" fill="url(#dots)"/>

  <text x="550" y="34" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2.4">COLLIE OPSMESH</text>
  <text x="550" y="58" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#0B1220" text-anchor="middle">IA pede / OpsMesh governa / Agents executam</text>
  <text x="550" y="80" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Mesh segura entre clientes de IA e a infraestrutura - sem entregar o cluster</text>

  <!-- PEDIDO -->
  <rect x="40" y="100" width="1020" height="110" rx="18" fill="url(#zoneAsk)"/>
  <text x="64" y="124" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#2563EB" letter-spacing="1.6">PEDIDO</text>
  <text x="920" y="124" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#B45309" letter-spacing="0.4">sem acesso direto ao cluster</text>

  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="64" y="138" width="172" height="52" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="150" y="170" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Cursor</text>
  </g>
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="252" y="138" width="172" height="52" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="338" y="170" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Claude Code</text>
  </g>
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="440" y="138" width="172" height="52" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="526" y="170" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Antigravity</text>
  </g>
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="628" y="138" width="172" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="714" y="170" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">Cockpit</text>
  </g>
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="816" y="138" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="926" y="170" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">MCP clients</text>
  </g>

  <path d="M550 210v24" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="568" y="228" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600" fill="#64748B">acao tipada</text>

  <!-- CONTROL PLANE -->
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="120" y="244" width="860" height="176" rx="18" fill="url(#cpGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="144" y="272" font-size="10" font-weight="700" fill="#93C5FD" letter-spacing="1.6">CONTROL PLANE</text>
    <text x="144" y="294" font-size="16" font-weight="800" fill="#FFFFFF">Governa antes de executar</text>

    <rect x="144" y="314" width="185" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="236.5" y="336" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Identidade</text>
    <text x="236.5" y="352" font-size="10" fill="#94A3B8" text-anchor="middle">FGAC / enroll</text>

    <rect x="345" y="314" width="185" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="437.5" y="336" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aprovacao</text>
    <text x="437.5" y="352" font-size="10" fill="#94A3B8" text-anchor="middle">HITL / Privacy Gate</text>

    <rect x="546" y="314" width="185" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="638.5" y="336" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI Policy</text>
    <text x="638.5" y="352" font-size="10" fill="#94A3B8" text-anchor="middle">fail-closed</text>

    <rect x="747" y="314" width="209" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="851.5" y="336" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Auditoria</text>
    <text x="851.5" y="352" font-size="10" fill="#94A3B8" text-anchor="middle">trilha completa</text>

    <rect x="144" y="380" width="812" height="24" rx="8" fill="#EFF6FF"/>
    <text x="550" y="397" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Postgres / RabbitMQ / Evidence Processor / AI Router</text>
  </g>

  <path d="M550 420v22" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="568" y="436" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600" fill="#64748B">envelope cifrado</text>

  <!-- Gateway + Edge em linha -->
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="120" y="452" width="360" height="88" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="300" y="488" font-size="14" font-weight="800" fill="#0B1220" text-anchor="middle">Gateway HTTPS opaco</text>
    <text x="300" y="512" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">nao le ciphertext / sem Postgres de negocio</text>
  </g>

  <path d="M480 496h40" stroke="#16A34A" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="540" y="440" width="440" height="112" rx="18" fill="url(#zoneEdge)"/>
  <text x="564" y="464" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#16A34A" letter-spacing="1.6">PERIMETRO DO CLIENTE</text>

  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="564" y="478" width="188" height="56" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="658" y="502" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">MeshAgent</text>
    <text x="658" y="520" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">outbound-only / plugins</text>
  </g>
  <g filter="url(#sh)" font-family="Inter,Arial,sans-serif">
    <rect x="768" y="478" width="188" height="56" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="862" y="502" font-size="13" font-weight="800" fill="#0B1220" text-anchor="middle">Edge Redactor</text>
    <text x="862" y="520" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">DLP na borda</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="120" y="580" width="860" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="550" y="603" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Infra: Kubernetes / VMs / middleware / observabilidade existente</text>
  </g>
</svg>
